<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Le prix du discipolat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;1,500;1,700&family=Mrs+Saint+Delafield&display=swap">
<style>
/* DA des visuels du culte : papier gris clair, bleu poudré, capitales Montserrat, grande lettre manuscrite, colline noire en bas. Écran de partage Zoom. */
:root{
  --papier:#E8E7E3; --papier-clair:#F5F4F1; --carte:#F3F2EE; --trait:#C9C7C1;
  --encre:#111111; --gris:#3A3A3A; --bleu:#8EA8C9; --bleu-fonce:#4F6F9A; --bleu-box:#7895BC; --nuit:#0B0B0B;
  --titre:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --script:"Mrs Saint Delafield","Snell Roundhand","Segoe Script",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--encre);font-family:var(--titre);
  background:radial-gradient(ellipse 70% 60% at 50% 35%,var(--papier-clair) 0%,var(--papier) 70%,#DEDDD8 100%) fixed,var(--papier);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>")}
*{box-sizing:border-box}
.stage{position:relative;z-index:1;min-height:100%;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;padding-top:clamp(14px,2.6vh,34px);gap:clamp(12px,2vh,22px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{height:clamp(32px,4.4vh,50px);width:auto;display:block}
.k{font-family:var(--cond);font-weight:600;font-size:clamp(12px,1.1vw,15px);letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}
.count{font-family:var(--cond);font-weight:600;font-size:clamp(18px,1.9vw,26px);letter-spacing:.06em;color:var(--bleu-fonce);font-variant-numeric:tabular-nums}
.count span{color:var(--encre)}
.bar{height:3px;background:var(--trait)}
.bar>div{height:100%;background:var(--bleu-box);transition:width .4s ease}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.2vh,24px);min-height:0}
.ref{align-self:flex-start;background:var(--bleu-box);color:#FFFFFF;font-family:var(--cond);font-weight:500;font-size:clamp(16px,1.6vw,22px);letter-spacing:.04em;text-transform:uppercase;padding:6px 16px}
h1.q{font-family:var(--titre);font-weight:500;text-transform:uppercase;letter-spacing:-.015em;font-size:clamp(24px,3.3vw,46px);line-height:1.12;margin:0;text-wrap:balance;max-width:28ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.3vw,16px)}
.opt{display:flex;align-items:center;gap:16px;background:var(--carte);border:1px solid var(--trait);padding:clamp(11px,1.8vh,18px) clamp(14px,1.5vw,20px);
  color:var(--encre);font-family:var(--titre);font-weight:500;font-size:clamp(16px,1.7vw,23px);line-height:1.3;text-align:left;cursor:pointer;min-width:0;transition:background .2s,border-color .2s,opacity .3s,color .2s}
.opt:hover{background:#FFFFFF}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--bleu-fonce);outline-offset:3px}
.num{flex:none;width:clamp(36px,3.2vw,46px);height:clamp(36px,3.2vw,46px);background:var(--encre);color:#FFFFFF;display:grid;place-items:center;font-family:var(--cond);font-weight:600;font-size:1.05em}
.opt.pick{border:2px solid var(--bleu-box)} .opt.pick .num{background:var(--bleu-box)}
.opt.ok{background:var(--encre);border-color:var(--encre);color:#FFFFFF} .opt.ok .num{background:var(--bleu);color:var(--encre)}
.opt.dim{opacity:.35}
.why{min-height:3.2em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:72ch}
.why .lbl{font-family:var(--cond);font-style:italic;font-weight:700;font-size:clamp(18px,1.8vw,25px);letter-spacing:.04em;text-transform:uppercase;color:var(--bleu-fonce)}
.why .txt{font-family:var(--cond);font-weight:500;font-size:clamp(17px,1.7vw,23px);line-height:1.45;color:var(--gris);flex:1;min-width:16ch}
.ground{position:relative;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));margin-top:clamp(4px,1vh,12px)}
.ground svg{display:block;width:100%;height:clamp(54px,9vh,96px)}
.band{background:var(--nuit);color:#FFFFFF;margin-top:-1px;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(clamp(12px,2vh,22px) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.band-in{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grp{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(14px,1.3vw,17px);padding:10px 18px;min-height:46px;cursor:pointer;border:1px solid #FFFFFF;background:transparent;color:#FFFFFF}
.btn:hover{background:#222}
.btn.main{background:var(--bleu);border-color:var(--bleu);color:var(--encre)}
.btn.main:hover{background:#A9BBD3}
.hint{font-family:var(--cond);font-size:14px;color:#BDBDBD}
.handle{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#BDBDBD}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,26px)}
.title{position:relative;padding-left:clamp(84px,11vw,150px);padding-top:clamp(10px,2vh,24px)}
.title .s{position:absolute;left:0;top:clamp(-40px,-4vh,-20px);font-family:var(--script);font-size:clamp(170px,22vw,300px);line-height:1;color:var(--encre)}
.title .l{display:block;font-family:var(--titre);font-weight:500;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(40px,6.4vw,92px);line-height:1}
.title .b{color:var(--bleu)}
.by{font-family:var(--cond);font-style:italic;font-weight:700;font-size:clamp(17px,1.8vw,24px);letter-spacing:.04em;text-transform:uppercase;color:var(--bleu-fonce);margin:0 0 0 clamp(84px,11vw,150px)}
.verse{font-family:var(--cond);font-style:italic;font-weight:500;font-size:clamp(18px,1.9vw,26px);line-height:1.4;color:var(--gris);margin:0 0 0 clamp(84px,11vw,150px);max-width:46ch}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:820px;padding:0;margin:0 0 0 clamp(84px,11vw,150px);list-style:none}
.list li{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid var(--trait);padding:12px 16px;font-family:var(--titre);font-weight:500;text-transform:uppercase;font-size:clamp(17px,1.8vw,24px)}
.list .num{background:var(--bleu-box)}
@media (max-width:640px){.opts,.list{grid-template-columns:1fr}.hint{display:none}.list,.by,.verse{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
